services:
  redis:
    image: redis:7-alpine
    container_name: imagelabs-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  s3:
    image: adobe/s3mock:latest
    container_name: imagelabs-s3
    ports:
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9191:9191"
    environment:
      initialBuckets: imagelabs-temp
    volumes:
      - s3_data:/data

volumes:
  redis_data:
  s3_data:
